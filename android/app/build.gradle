plugins { id 'com.android.application' }
def breezeOrigin = providers.gradleProperty('breezeOrigin').getOrElse('https://breeze.example.com')
if (!(breezeOrigin ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) throw new GradleException('breezeOrigin must be an HTTPS origin without a trailing slash or path')
android {
    namespace 'com.breeze.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.breeze.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'BREEZE_ORIGIN', '"' + breezeOrigin + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
