plugins { id 'com.android.application' }
def breezeOrigin = providers.gradleProperty('breezeOrigin').getOrElse('https://breeze.example.com')
if (!(breezeOrigin ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) throw new GradleException('breezeOrigin must be an HTTPS origin without a trailing slash or path')
android {
    namespace 'com.breeze.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.breeze.app'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('breezeVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('breezeVersionName').getOrElse('1.0.0')
        buildConfigField 'String', 'BREEZE_ORIGIN', '"' + breezeOrigin + '"'
    }
    // CI can use a privately backed-up signing key; passwords never enter source control.
    if (System.getenv('BREEZE_KEYSTORE_PATH')) {
        signingConfigs {
            distribution {
                storeFile file(System.getenv('BREEZE_KEYSTORE_PATH'))
                storePassword System.getenv('BREEZE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BREEZE_KEY_ALIAS')
                keyPassword System.getenv('BREEZE_KEY_PASSWORD')
            }
        }
        buildTypes { debug { signingConfig signingConfigs.distribution } }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
